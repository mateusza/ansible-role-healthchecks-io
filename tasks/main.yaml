---
- name: Healthcheck.io cloud configuration
  delegate_to: localhost
  block:
    - name: API key presence
      ansible.builtin.assert:
        that: healthchecks_io_api_key != ""
        fail_msg: |
          Register API key and define it as `healthchecks_io_api_key`

    - name: Query API for existing check
      ansible.builtin.uri:
        url: "{{ healthchecks_io_baseurl }}/checks/?slug={{ healthchecks_io_slug }}"
        method: GET
        headers:
          X-Api-Key: "{{ healthchecks_io_api_key }}"
        return_content: true
        status_code: 200
      register: hc_api_get_check_uri
      check_mode: false

    - name: Create check if not present
      ansible.builtin.uri:
        url: "{{ healthchecks_io_baseurl }}/checks/"
        method: POST
        headers:
          X-Api-Key: "{{ healthchecks_io_api_key }}"
        body:
          name: "{{ healthchecks_io_name }}"
          slug: "{{ healthchecks_io_slug }}"
          channels: "{{ healthchecks_io_channels | join(',') }}"
          timeout: 120
          grace: 300
        body_format: json
        status_code: 201
      register: hc_api_post_check_uri
      when: hc_api_get_check_uri.json.checks | length == 0

- name: Healthcheck.io monitored system configuration
  when: not is_openwrt | default(false)
  block:
    - name: Configuration file
      vars:
        post_url: "{{
                      (healthchecks_io_ping_baseurl
                       ~ '/' ~ healthchecks_io_ping_key
                       ~ '/' ~ healthchecks_io_slug)
                      if (healthchecks_io_ping_key | default('') | length > 0)
                      else (hc_api_get_check_uri.json.checks | first
                            if (hc_api_get_check_uri.json.checks | length > 0)
                            else hc_api_post_check_uri.json).ping_url
                   }}"
      ansible.builtin.copy:
        dest: "{{ healthchecks_io_conf }}"
        content: |
          POST_URL="{{ post_url }}"
        mode: '0600'
        owner: root
        group: root

    - name: Install curl
      ansible.builtin.package:
        name:
          - curl

    - name: Systemd service
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ healthchecks_io_service_name }}.service"
        content: |
          [Unit]
          Description=Healthcheck.io Alive

          [Service]
          Type=oneshot
          EnvironmentFile={{ healthchecks_io_conf }}
          ExecStart=/usr/bin/curl -s -X POST "$POST_URL"
        owner: root
        group: root
        mode: '0644'

    - name: Systemd timer configuration
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ healthchecks_io_service_name }}.timer"
        content: |
          [Unit]
          Description=Run {{ healthchecks_io_service_name }}

          [Timer]
          OnCalendar=*-*-* *:*:00
          RandomizedDelaySec=30
          Persistent=true

          [Install]
          WantedBy=timers.target
        owner: root
        group: root
        mode: '0644'

    - name: Systemd timer
      ansible.builtin.systemd:
        daemon_reload: true
        name: "{{ healthchecks_io_service_name }}.timer"
        enabled: true
        state: started

- name: Healthcheck.io monitored system configuration (OpenWRT)
  when: is_openwrt | default(false)
  block:
    - name: Create /etc/scripts
      ansible.builtin.raw: |
        if ! [ -e /etc/scripts ]
        then
          mkdir /etc/scripts
          echo "_CHANGED_"
        fi
      register: this
      changed_when: |
        "_CHANGED_" in this.stdout

    - name: Create script
      vars:
        post_url: "{{
                      (healthchecks_io_ping_baseurl
                       ~ '/' ~ healthchecks_io_ping_key
                       ~ '/' ~ healthchecks_io_slug)
                      if (healthchecks_io_ping_key | default('') | length > 0)
                      else (hc_api_get_check_uri.json.checks | first
                            if (hc_api_get_check_uri.json.checks | length > 0)
                            else hc_api_post_check_uri.json).ping_url
                   }}"
        script_path: /etc/scripts/healthcheck-io.alive.sh
        tmp_filename: "/tmp/file{{ 1000000000 | random() }}"

      ansible.builtin.raw: |
        cat > {{ tmp_filename }} << EOF
        #!/bin/sh

        wget -O/dev/null -q "{{ post_url }}"
        EOF

        if ! cmp "{{ script_path }}" "{{ tmp_filename }}"
        then
          cp "{{ tmp_filename }}" "{{ script_path }}"
          chmod +x "{{ script_path }}"
          echo "_CHANGED_"
        fi

        rm {{ tmp_filename }}
      register: this
      changed_when: |
        "_CHANGED_" in this.stdout

    - name: Create cronjob
      vars:
        cron_spec: "* * * * * /etc/scripts/healthcheck-io.alive.sh"
      ansible.builtin.raw: |
        if ! grep "{{ cron_spec }}" /etc/crontabs/root
        then
          echo "{{ cron_spec }}" >> /etc/crontabs/root
          /etc/init.d/cron restart
          echo "_CHANGED_"
        fi
      register: this
      changed_when: |
        "_CHANGED_" in this.stdout

